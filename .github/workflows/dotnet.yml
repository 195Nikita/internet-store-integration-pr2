name: build-and-smoke-test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/InternetStoreIntegration/InternetStoreIntegration.csproj --configuration Release
      - name: Smoke tests
        run: dotnet run --project tests/InternetStoreIntegration.SmokeTests --configuration Release
